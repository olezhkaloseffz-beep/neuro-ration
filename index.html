<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>НейроРацион 3.0 — умный помощник</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --primary: #2d6a4f; --primary-light: #52b788; --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --text-main: #f8fafc; --text-muted: #94a3b8; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color: var(--text-main); line-height: 1.6; background-color: var(--bg-dark); background-image: radial-gradient(circle at top right, #1b4332, transparent 40%), radial-gradient(circle at bottom left, #0f172a, transparent 40%); min-height: 100vh; -webkit-user-select: none; user-select: none; }
  header { padding: 40px 20px; text-align: center; }
  header h1 { font-size: 2.8em; margin-bottom: 10px; background: linear-gradient(90deg, #b7e4c7, #52b788); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header p { font-size: 1.2em; color: var(--text-muted); }
  .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 40px; }
  .glass-panel { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  h2 { color: #b7e4c7; font-size: 1.5em; margin-bottom: 20px; border-left: 4px solid var(--primary-light); padding-left: 15px; }

  /* Зона загрузки */
  .upload-zone { border: 2px dashed rgba(82, 183, 136, 0.5); border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; background: rgba(82, 183, 136, 0.05); margin-bottom: 20px; transition: 0.3s; }
  .upload-zone:hover { background: rgba(82, 183, 136, 0.1); }
  .upload-zone input { display: none; }
  .upload-zone span { font-size: 3em; display: block; margin-bottom: 10px; }
  .upload-status { color: #52b788; text-align: center; font-weight: bold; margin-top: 10px; }

  /* Кнопки продуктов */
  .ingredients-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .ingredient-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 15px 10px; border-radius: 12px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-main); }
  .ingredient-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--primary-light); transform: translateY(-2px); }
  .ingredient-btn.active { background: rgba(82, 183, 136, 0.2); border-color: var(--primary-light); box-shadow: 0 0 15px rgba(82, 183, 136, 0.2); }
  .ingredient-btn span.icon { font-size: 2em; }
  .ingredient-btn span.name { font-size: 0.9em; font-weight: bold; }

  /* Кнопка генерации */
  .generate-btn { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; border: none; padding: 18px; font-size: 1.2em; font-weight: bold; border-radius: 15px; cursor: pointer; width: 100%; transition: 0.3s; box-shadow: 0 5px 15px rgba(82, 183, 136, 0.3); }
  .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(82, 183, 136, 0.5); }
  .generate-btn:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Результаты */
  .result-section { display: none; }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .recipe-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border-top: 3px solid var(--primary-light); animation: slideUp 0.5s forwards; opacity: 0; transform: translateY(20px); }
  .recipe-card:nth-child(2) { animation-delay: 0.15s; }
  .recipe-card:nth-child(3) { animation-delay: 0.3s; }
  .recipe-card h3 { color: var(--primary-light); margin-bottom: 10px; font-size: 1.2em; }
  .recipe-card p { font-size: 0.9em; color: var(--text-muted); margin-bottom: 5px; }
  .recipe-card .badge { display: inline-block; background: rgba(82, 183, 136, 0.2); color: #b7e4c7; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; margin-top: 10px; }

  .shopping-list { background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.3); padding: 20px; border-radius: 15px; }
  .shopping-list h3 { color: #ffca2c; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
  .shopping-list ul { list-style: none; }
  .shopping-list li { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .shopping-list li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary-light); cursor: pointer; }
  .shopping-list li.completed span { text-decoration: line-through; opacity: 0.5; }

  @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
  footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.9em; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 40px; }
</style>
</head>
<body>

<header>
  <h1>🥗 НейроРацион 3.0</h1>
  <p>Твой персональный ИИ-нутрициолог</p>
</header>

<div class="container">
  
  <!-- Шаг 1: Загрузка фото -->
  <div class="glass-panel">
    <h2>Шаг 1: Фото холодильника</h2>
    <label class="upload-zone" for="fileInput">
      <span>📸</span>
      <p>Нажмите, чтобы загрузить фото (или перетащите)</p>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(this)">
    </label>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <!-- Шаг 2: Выбор продуктов -->
  <div class="glass-panel">
    <h2>Шаг 2: Ваши продукты</h2>
    <p style="margin-bottom: 15px; color: var(--text-muted); font-size: 0.9em;">Отметьте то, что у вас есть:</p>
    <div class="ingredients-grid" id="ingredientsGrid"></div>
    <button class="generate-btn" id="generateBtn" onclick="generateMenu()">✨ Сгенерировать рацион</button>
  </div>

  <!-- Шаг 3: Результат -->
  <div class="result-section" id="resultSection">
    <div class="glass-panel">
      <h2>Ваш рацион на день</h2>
      <div class="menu-grid" id="menuResult"></div>
      <div class="shopping-list" id="shoppingResult">
        <h3>🛒 Список покупок</h3>
        <ul id="shoppingList"></ul>
      </div>
    </div>
  </div>

</div>

<footer>
  © 2026 НейроРацион — учебный стартап-проект. Создан с помощью ИИ.
</footer>

<script>
  document.addEventListener('contextmenu', e => e.preventDefault());

  // База данных
  const database = {
    products: [
      { id: 'chicken', name: 'Курица', icon: '🍗' }, { id: 'rice', name: 'Рис', icon: '🍚' },
      { id: 'eggs', name: 'Яйца', icon: '🥚' }, { id: 'tomato', name: 'Помидоры', icon: '🍅' },
      { id: 'cheese', name: 'Сыр', icon: '🧀' }, { id: 'pasta', name: 'Макароны', icon: '🍝' },
      { id: 'potato', name: 'Картофель', icon: '🥔' }, { id: 'greens', name: 'Зелень', icon: '🌿' },
      { id: 'bread', name: 'Хлеб', icon: '🍞' }, { id: 'milk', name: 'Молоко', icon: '🥛' },
      { id: 'beef', name: 'Говядина', icon: '🥩' }, { id: 'fish', name: 'Рыба', icon: '🐟' }
    ],
    recipes: [
      { type: 'breakfast', name: 'Омлет с сыром', ingredients: ['eggs', 'cheese'], missing: ['tomato'], calories: '350 ккал' },
      { type: 'lunch', name: 'Курица с рисом', ingredients: ['chicken', 'rice'], missing: ['greens'], calories: '550 ккал' },
      { type: 'dinner', name: 'Салат из помидоров', ingredients: ['tomato', 'greens'], missing: [], calories: '150 ккал' }
    ]
  };

  let selectedProducts = [];

  // Отрисовка продуктов
  function renderIngredients() {
    const grid = document.getElementById('ingredientsGrid');
    grid.innerHTML = '';
    database.products.forEach(product => {
      const btn = document.createElement('div');
      btn.className = 'ingredient-btn';
      btn.innerHTML = `<span class="icon">${product.icon}</span><span class="name">${product.name}</span>`;
      btn.onclick = () => toggleProduct(product.id, btn);
      grid.appendChild(btn);
    });
  }

  function toggleProduct(id, btn) {
    if (selectedProducts.includes(id)) {
      selectedProducts = selectedProducts.filter(p => p !== id);
      btn.classList.remove('active');
    } else {
      selectedProducts.push(id);
      btn.classList.add('active');
    }
  }

  // Загрузка фото (имитация)
  function handleFileUpload(input) {
    if (input.files && input.files[0]) {
      const status = document.getElementById('uploadStatus');
      status.innerText = '⏳ Нейросеть анализирует фото...';
      
      setTimeout(() => {
        status.innerText = '✅ Продукты найдены! Отметьте их в списке ниже.';
        
        // Автоматически выбираем 4 случайных продукта
        selectedProducts = [];
        document.querySelectorAll('.ingredient-btn').forEach(b => b.classList.remove('active'));
        
        const randomProducts = [...database.products].sort(() => 0.5 - Math.random()).slice(0, 4);
        randomProducts.forEach(prod => {
          selectedProducts.push(prod.id);
          document.querySelectorAll('.ingredient-btn').forEach(btn => {
            if (btn.innerHTML.includes(prod.name)) btn.classList.add('active');
          });
        });
      }, 1500);
    }
  }

  // Генерация меню
  function generateMenu() {
    if (selectedProducts.length === 0) {
      alert('Выберите хотя бы один продукт!');
      return;
    }

    const resultSection = document.getElementById('resultSection');
    const menuResult = document.getElementById('menuResult');
    const shoppingList = document.getElementById('shoppingList');
    const btn = document.getElementById('generateBtn');
    
    btn.disabled = true;
    btn.innerText = '⏳ ИИ подбирает рацион...';
    resultSection.style.display = 'none';

    setTimeout(() => {
      let menuHTML = '';
      let missingIngredients = new Set();

      database.recipes.forEach(dish => {
        dish.missing.forEach(ing => missingIngredients.add(ing));
        
        menuHTML += `
          <div class="recipe-card">
            <h3>${dish.type === 'breakfast' ? '🍳 Завтрак' : dish.type === 'lunch' ? '🍲 Обед' : '🥗 Ужин'}</h3>
            <p style="font-size: 1.1em; color: white; font-weight: bold; margin: 5px 0;">${dish.name}</p>
            <p><b>Используем:</b> ${dish.ingredients.map(i => database.products.find(p => p.id === i).name).join(', ')}</p>
            <span class="badge">${dish.calories}</span>
          </div>
        `;
      });

      menuResult.innerHTML = menuHTML;

      if (missingIngredients.size > 0) {
        let shoppingHTML = '';
        missingIngredients.forEach(ing => {
          const product = database.products.find(p => p.id === ing);
          shoppingHTML += `<li onclick="toggleCheckbox(this)"><input type="checkbox"><span>${product.icon} ${product.name}</span></li>`;
        });
        shoppingList.innerHTML = shoppingHTML;
        document.getElementById('shoppingResult').style.display = 'block';
      } else {
        document.getElementById('shoppingResult').style.display = 'none';
      }

      btn.disabled = false;
      btn.innerText = '✨ Сгенерировать рацион';
      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior: 'smooth' });
    }, 1500);
  }

  function toggleCheckbox(li) {
    const checkbox = li.querySelector('input');
    checkbox.checked = !checkbox.checked;
    li.classList.toggle('completed', checkbox.checked);
  }

  renderIngredients();
</script>

</body>
</html>
