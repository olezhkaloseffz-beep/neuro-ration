<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>НейроРацион — умный подбор рациона</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color: #1a2e1a; line-height: 1.6; background-color: #f8fdf9; }
  header { background: linear-gradient(135deg, #1b4332, #2d6a4f); color: #fff; padding: 50px 20px; text-align: center; }
  header h1 { font-size: 2.5em; margin-bottom: 10px; }
  header p { font-size: 1.2em; color: #b7e4c7; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  section { margin-bottom: 40px; }
  h2 { color: #2d6a4f; font-size: 1.6em; margin-bottom: 20px; border-left: 5px solid #95d5b2; padding-left: 15px; }
  
  /* Блок выбора продуктов */
  .ingredients-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .ingredient-btn { 
    background: #fff; border: 2px solid #d8f3dc; padding: 15px 10px; border-radius: 10px; 
    cursor: pointer; font-size: 1em; font-weight: bold; color: #2d6a4f; transition: 0.2s; 
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .ingredient-btn:hover { border-color: #95d5b2; }
  .ingredient-btn.active { background: #d8f3dc; border-color: #52b788; box-shadow: 0 0 10px rgba(82, 183, 136, 0.3); }
  .ingredient-btn span { font-size: 1.5em; }

  .generate-btn { 
    background: #2d6a4f; color: white; border: none; padding: 15px 40px; font-size: 1.2em; 
    font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px;
  }
  .generate-btn:hover { background: #1b4332; transform: scale(1.02); }
  .generate-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

  /* Блок результата */
  .result-section { display: none; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); animation: fadeIn 0.5s; }
  .recipe-card { background: #f1faee; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #52b788; }
  .recipe-card h3 { color: #2d6a4f; margin-bottom: 5px; }
  .recipe-card p { font-size: 0.95em; color: #333; }
  .shopping-list { background: #fff3cd; padding: 20px; border-radius: 10px; border-left: 4px solid #ffca2c; }
  .shopping-list h3 { color: #856404; margin-bottom: 10px; }
  .shopping-list ul { padding-left: 20px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  footer { background: #1b4332; color: #b7e4c7; text-align: center; padding: 25px 20px; font-size: 0.9em; }
</style>
</head>
<body>
<header>
  <h1>🥗 НейроРацион</h1>
  <p>Умный подбор рациона из того, что есть под рукой</p>
</header>

<div class="container">
  <section>
    <h2>Шаг 1: Отметьте, что у вас есть</h2>
    <p style="margin-bottom: 15px; color: #555;">Нажмите на продукты, которые есть в вашем холодильнике:</p>
    
    <div class="ingredients-grid" id="ingredientsGrid">
      <!-- Кнопки будут сгенерированы через JS -->
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateMenu()">✨ Сгенерировать рацион</button>
  </section>

  <!-- Блок с результатом -->
  <section class="result-section" id="resultSection">
    <h2>Ваш персональный рацион на день</h2>
    
    <div id="menuResult"></div>

    <div class="shopping-list" id="shoppingResult">
      <h3>🛒 Что нужно докупить:</h3>
      <ul id="shoppingList"></ul>
    </div>
  </section>
</div>

<footer>
  © 2026 НейроРацион — учебный стартап-проект. Создан с помощью ИИ.
</footer>

<script>
  // База данных продуктов и блюд (имитация работы ИИ)
  const database = {
    products: [
      { id: 'chicken', name: 'Курица', icon: '🍗' },
      { id: 'rice', name: 'Рис', icon: '🍚' },
      { id: 'eggs', name: 'Яйца', icon: '🥚' },
      { id: 'tomato', name: 'Помидоры', icon: '🍅' },
      { id: 'cheese', name: 'Сыр', icon: '🧀' },
      { id: 'pasta', name: 'Макароны', icon: '🍝' },
      { id: 'potato', name: 'Картофель', icon: '🥔' },
      { id: 'greens', name: 'Зелень', icon: '🌿' },
      { id: 'bread', name: 'Хлеб', icon: '🍞' },
      { id: 'milk', name: 'Молоко', icon: '🥛' }
    ],
    recipes: {
      breakfast: [
        { name: 'Омлет с сыром', ingredients: ['eggs', 'cheese'], missing: ['greens'], calories: '350 ккал' },
        { name: 'Бутерброды с сыром', ingredients: ['bread', 'cheese'], missing: ['tomato'], calories: '250 ккал' }
      ],
      lunch: [
        { name: 'Курица с рисом', ingredients: ['chicken', 'rice'], missing: ['tomato', 'greens'], calories: '550 ккал' },
        { name: 'Паста с сыром', ingredients: ['pasta', 'cheese'], missing: ['milk'], calories: '600 ккал' },
        { name: 'Жареная картошка с курицей', ingredients: ['potato', 'chicken'], missing: [], calories: '650 ккал' }
      ],
      dinner: [
        { name: 'Салат из помидоров с зеленью', ingredients: ['tomato', 'greens'], missing: ['cheese'], calories: '200 ккал' },
        { name: 'Омлет с помидорами', ingredients: ['eggs', 'tomato'], missing: [], calories: '300 ккал' }
      ]
    }
  };

  let selectedProducts = [];

  // 1. Отрисовка кнопок продуктов
  function renderIngredients() {
    const grid = document.getElementById('ingredientsGrid');
    grid.innerHTML = '';
    database.products.forEach(product => {
      const btn = document.createElement('div');
      btn.className = 'ingredient-btn';
      btn.innerHTML = `<span>${product.icon}</span> ${product.name}`;
      btn.onclick = () => toggleProduct(product.id, btn);
      grid.appendChild(btn);
    });
  }

  // 2. Выбор/отмена продукта
  function toggleProduct(id, btnElement) {
    if (selectedProducts.includes(id)) {
      selectedProducts = selectedProducts.filter(p => p !== id);
      btnElement.classList.remove('active');
    } else {
      selectedProducts.push(id);
      btnElement.classList.add('active');
    }
  }

  // 3. Генерация меню (главная фича)
  function generateMenu() {
    if (selectedProducts.length === 0) {
      alert('Пожалуйста, выберите хотя бы один продукт!');
      return;
    }

    const resultSection = document.getElementById('resultSection');
    const menuResult = document.getElementById('menuResult');
    const shoppingList = document.getElementById('shoppingList');
    
    // Показываем загрузку (эффект ИИ)
    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.innerText = '⏳ ИИ подбирает рацион...';
    resultSection.style.display = 'none';

    setTimeout(() => {
      let menuHTML = '';
      let missingIngredients = new Set();

      // Функция подбора блюда
      function findDish(mealType) {
        const possibleDishes = database.recipes[mealType];
        // Ищем блюдо, для которого у нас есть максимум ингредиентов
        let bestDish = possibleDishes[0];
        let maxMatches = -1;

        possibleDishes.forEach(dish => {
          const matches = dish.ingredients.filter(ing => selectedProducts.includes(ing)).length;
          if (matches > maxMatches) {
            maxMatches = matches;
            bestDish = dish;
          }
        });

        // Добавляем недостающие ингредиенты в список покупок
        bestDish.missing.forEach(ing => missingIngredients.add(ing));

        return `
          <div class="recipe-card">
            <h3>${mealType === 'breakfast' ? '🍳 Завтрак' : mealType === 'lunch' ? '🍲 Обед' : '🥗 Ужин'}: ${bestDish.name}</h3>
            <p><b>Калорийность:</b> ${bestDish.calories}</p>
            <p><b>Используем:</b> ${bestDish.ingredients.map(i => database.products.find(p => p.id === i).name).join(', ')}</p>
          </div>
        `;
      }

      // Собираем меню
      menuHTML += findDish('breakfast');
      menuHTML += findDish('lunch');
      menuHTML += findDish('dinner');

      menuResult.innerHTML = menuHTML;

      // Собираем список покупок
      if (missingIngredients.size > 0) {
        let shoppingHTML = '';
        missingIngredients.forEach(ing => {
          const product = database.products.find(p => p.id === ing);
          shoppingHTML += `<li>${product.icon} ${product.name}</li>`;
        });
        shoppingList.innerHTML = shoppingHTML;
        document.getElementById('shoppingResult').style.display = 'block';
      } else {
        document.getElementById('shoppingResult').style.display = 'none';
      }

      // Возвращаем кнопку
      btn.disabled = false;
      btn.innerText = '✨ Сгенерировать рацион';
      resultSection.style.display = 'block';
      
      // Прокрутка к результату
      resultSection.scrollIntoView({ behavior: 'smooth' });
    }, 1000); // Задержка для эффекта "ИИ думает"
  }

  // Запуск
  renderIngredients();
</script>

</body>
</html>
