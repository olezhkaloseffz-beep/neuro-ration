<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>НейроРацион 3.0 — умный помощник</title>
<style>
  /* ... (Оставляем все стили из предыдущего сообщения, они красивые) ... */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --primary: #2d6a4f; --primary-light: #52b788; --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --text-main: #f8fafc; --text-muted: #94a3b8; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color: var(--text-main); line-height: 1.6; background-color: var(--bg-dark); background-image: radial-gradient(circle at top right, #1b4332, transparent 40%), radial-gradient(circle at bottom left, #0f172a, transparent 40%); min-height: 100vh; }
  header { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, rgba(15,23,42,0.8) 0%, rgba(15,23,42,0) 100%); }
  header h1 { font-size: 2.8em; margin-bottom: 10px; background: linear-gradient(90deg, #b7e4c7, #52b788); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header p { font-size: 1.2em; color: var(--text-muted); }
  .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 40px; }
  .glass-panel { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  h2 { color: #b7e4c7; font-size: 1.5em; margin-bottom: 20px; border-left: 4px solid var(--primary-light); padding-left: 15px; }

  /* Стили для загрузки фото */
  .upload-zone { border: 2px dashed rgba(82, 183, 136, 0.5); border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; background: rgba(82, 183, 136, 0.05); margin-bottom: 20px; }
  .upload-zone input { display: none; }
  .upload-zone span { font-size: 3em; display: block; }
  
  /* Стили для чата */
  .chat-box { height: 300px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
  .message { max-width: 80%; padding: 10px 15px; border-radius: 10px; font-size: 0.95em; }
  .message.user { align-self: flex-end; background: var(--primary); color: white; }
  .message.ai { align-self: flex-start; background: rgba(255,255,255,0.1); color: var(--text-main); }
  .message.ai.loading { font-style: italic; opacity: 0.7; }
  
  .input-group { display: flex; gap: 10px; }
  .input-group input { flex: 1; padding: 15px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; }
  .input-group button { padding: 15px 25px; border-radius: 10px; border: none; background: var(--primary-light); color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .input-group button:hover { background: #b7e4c7; }
  .input-group button:disabled { background: #475569; cursor: not-allowed; }

  /* Быстрые кнопки */
  .quick-questions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .quick-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; color: var(--text-muted); cursor: pointer; font-size: 0.85em; transition: 0.2s; }
  .quick-btn:hover { background: rgba(82, 183, 136, 0.2); color: white; }

  footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.9em; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 40px; }
</style>
</head>
<body>

<header>
  <h1>🥗 НейроРацион 3.0</h1>
  <p>Твой персональный ИИ-нутрициолог</p>
</header>

<div class="container">
  
  <!-- Блок загрузки фото -->
  <div class="glass-panel">
    <h2>Шаг 1: Фото холодильника</h2>
    <label class="upload-zone" for="fileInput">
      <span>📸</span>
      <p>Нажмите, чтобы загрузить фото (или перетащите)</p>
      <p style="font-size: 0.8em; color: #52b788;">*ИИ найдет продукты и предложит рацион</p>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(this)">
    </label>
    <div id="uploadStatus" style="color: #52b788; text-align: center;"></div>
  </div>

  <!-- Блок чата с ИИ -->
  <div class="glass-panel">
    <h2>Шаг 2: Спросите ИИ</h2>
    
    <div class="chat-box" id="chatBox">
      <div class="message ai">Привет! Я твой ИИ-помощник. Загрузи фото или просто напиши, что у тебя есть в холодильнике, и я предложу рецепт.</div>
    </div>

    <div class="input-group">
      <input type="text" id="userInput" placeholder="Например: Что приготовить из курицы и риса?" onkeypress="handleEnter(event)">
      <button id="sendBtn" onclick="sendMessage()">Отправить</button>
    </div>

    <div class="quick-questions">
      <button class="quick-btn" onclick="quickAsk('Что приготовить из яиц и сыра?')">Яйца и сыр</button>
      <button class="quick-btn" onclick="quickAsk('Рецепт с курицей и рисом')">Курица и рис</button>
      <button class="quick-btn" onclick="quickAsk('Полезный завтрак за 10 минут')">Быстрый завтрак</button>
    </div>
  </div>

</div>

<footer>
  © 2026 НейроРацион — учебный стартап-проект. Создан с помощью ИИ.
</footer>

<script>
  // --- НАСТРОЙКИ YANDEXGPT ---
  // ⚠️ ВСТАВЬТЕ СЮДА ВАШ API-КЛЮЧ И ID КАТАЛОГА
  const YANDEX_API_KEY = 'AQVNzdq3Tv6baoT_PbM6222MhrZ9Q4gKrx73Veut';
  const YANDEX_FOLDER_ID = 'ajedrarktvkrda2fufdj';
  // ---------------------------

  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // Обработка загрузки фото (имитация)
  function handleFileUpload(input) {
    if (input.files && input.files[0]) {
      const status = document.getElementById('uploadStatus');
      status.innerText = '⏳ Анализируем фото...';
      
      // Имитация задержки
      setTimeout(() => {
        status.innerText = '✅ Фото загружено! Теперь спросите ИИ, что приготовить.';
        // Автоматически добавляем сообщение в чат от лица пользователя
        addMessage('Я загрузил фото холодильника. Что можно приготовить?', 'user');
        // Имитация ответа ИИ на фото
        setTimeout(() => {
          addMessage('Вижу на фото курицу, рис и помидоры. Могу предложить рецепт "Курица с рисом и овощами". Хотите пошаговый рецепт?', 'ai');
        }, 1000);
      }, 1500);
    }
  }

  // Функция для быстрых вопросов
  function quickAsk(text) {
    userInput.value = text;
    sendMessage();
  }

  // Обработка нажатия Enter
  function handleEnter(e) {
    if (e.key === 'Enter') sendMessage();
  }

  // Функция добавления сообщения в чат
  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.innerText = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msgDiv;
  }

  // Основная функция отправки сообщения в YandexGPT
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // 1. Добавляем сообщение пользователя
    addMessage(text, 'user');
    userInput.value = '';
    
    // 2. Блокируем кнопку и показываем загрузку
    sendBtn.disabled = true;
    const loadingMsg = addMessage('Думаю...', 'ai loading');

    try {
      // 3. Отправляем запрос в YandexGPT
      // Используем OpenAI-совместимый эндпоинт (он проще)
      const response = await fetch('https://llm.api.cloud.yandex.net/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Api-Key ${AQVNzdq3Tv6baoT_PbM6222MhrZ9Q4gKrx73Veut}`
        },
        body: JSON.stringify({
          model: `gpt://${ajedrarktvkrda2fufdj}/yandexgpt-lite`, // Бесплатная/дешевая модель
          messages: [
            { role: 'system', content: 'Ты — помощник по питанию. Отвечай кратко и по делу, предлагай простые рецепты.' },
            { role: 'user', content: text }
          ],
          temperature: 0.7,
          max_tokens: 500
        })
      });

      if (!response.ok) {
        const err = await response.text();
        throw new Error(err);
      }

      const data = await response.json();
      const aiText = data.choices[0].message.content;

      // 4. Заменяем "Думаю..." на реальный ответ
      loadingMsg.innerText = aiText;
      loadingMsg.classList.remove('loading');

    } catch (error) {
      console.error(error);
      loadingMsg.innerText = `⚠️ Ошибка: ${error.message}. Проверьте ключ и ID каталога.`;
      loadingMsg.style.color = '#ff6b6b';
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>

</body>
</html>
